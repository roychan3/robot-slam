ekf_slam:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    map_topic: /ekf/map
    pose_topic: /ekf/pose
    map_frame: map
    odom_frame: odom

    # Only one SLAM backend may publish map -> odom. The launch file enforces
    # this when multiple estimators are enabled for comparison.
    publish_tf: false

    resolution: 0.05
    map_width: 400
    map_height: 400
    origin_x: -10.0
    origin_y: -10.0
    max_range: 7.5
    max_beams: 90
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.08

    linear_motion_noise: 0.05
    angular_motion_noise: 0.05
    motion_noise_floor: 0.005
    initial_position_variance: 0.0001
    initial_heading_variance: 0.0001
    measurement_position_variance: 0.01
    measurement_heading_variance: 0.0064

    scan_match_linear_window: 0.20
    scan_match_angular_window: 0.16
    scan_match_linear_step: 0.05
    scan_match_angular_step: 0.04
    minimum_scan_score: 0.52

    hit_log_odds: 0.85
    miss_log_odds: -0.40
    map_publish_interval: 1.0

    # Planar base_footprint -> base_scan extrinsics from the bundled URDF.
    laser_x: -0.032
    laser_y: 0.0
    laser_yaw: 0.0
